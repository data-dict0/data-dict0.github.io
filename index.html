<!DOCTYPE html>
<html lang="en">
<head>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1 user-scalable=no"
    />
    <script
      src="https://kit.fontawesome.com/092b142fb0.js"
      crossorigin="anonymous"
    ></script>

    <!-- stylesheets -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi"
      crossorigin="anonymous"
    />
        <link rel="stylesheet" href="styles.css">

    <title>Flooding not controlled</title>
    <meta charset="utf-8" />
    <meta
      property="og:title"
      content="Flooding not controlled"
    />
    <meta
      property="og:description"
      content="Some areas where flood control projects were supposedly completed in the past years were still inundated with flood waters."
    />
    <meta property="og:type" content="article" />
    <meta
      property="og:image"
      content="https://data-dict0.github.io/mapping-floods/assets/share-card.png"
    />
    <meta property="og:image:width" content="1000" />
    <meta property="og:image:height" content="500" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:creator" content="@prinzmagtulis" />

    <script src="https://unpkg.com/intersection-observer@0.5.1/intersection-observer.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.3.0/d3.min.js"></script>

    <!-- 1. Load the official Mapbox GL JS engine styles -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.30.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.30.0/mapbox-gl.js"></script>
    <script src="map.js" defer></script>
</head>
<body>

    <!-- Main Map Background View Container -->
    <div id="map-container">
        <div id="map"></div>
    </div>

    <!-- Independent Text Box Step Panel -->
    <div id="story-sidebar">
        <div id="step-title"></div>
        <div id="step-deck"></div>
        <div id="step-description"></div>
    </div>

    <!-- Floating Minimap Window Container -->
    <div id="inset-map-container">
        <div id="inset-map"></div>
    </div>
</body>
</html>
